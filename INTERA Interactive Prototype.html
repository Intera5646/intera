<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTERA — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  body { background: #B89A6B; overflow: auto; margin: 0; }

  /* Transition keyframes used by interactive-shell.jsx */
  @keyframes slideOut {
    from { transform: translateX(0);          opacity: 1; }
    to   { transform: translateX(var(--outX)); opacity: 0.6; }
  }
  @keyframes slideIn {
    from { transform: translateX(var(--inX)); opacity: 0.6; }
    to   { transform: translateX(0);          opacity: 1; }
  }
  @keyframes modalFromIn {
    from { transform: translateY(100%); opacity: 1; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes modalFromOut {
    from { transform: translateY(0)   scale(1);    opacity: 1; }
    to   { transform: translateY(0)   scale(0.96); opacity: 0.65; }
  }
  @keyframes fadeOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0%   { transform: scale(0.5); opacity: 0; }
    70%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes bouncePop {
    0%   { transform: scale(0.3); }
    60%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  /* Welcome entrance */
  .scr .wordmark, .scr.navy .display { animation: fadeUp 800ms ease-out both; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="screens-a.jsx"></script>
<script type="text/babel" src="screens-b.jsx"></script>
<script type="text/babel" src="screens-c.jsx"></script>
<script type="text/babel" src="screens-d.jsx"></script>
<script type="text/babel" src="interactive.jsx"></script>
<script type="text/babel" src="interactive-shell.jsx"></script>

</body>
</html>
