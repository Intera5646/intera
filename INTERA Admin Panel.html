<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTERA — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  body { background: #ECE4D4; overflow: hidden; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="admin.jsx"></script>
<script type="text/babel" src="admin-2.jsx"></script>

<script type="text/babel">
  const AB_W = 1440;
  const AB_H = 1000;

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="admin" title="INTERA · Admin Panel" subtitle="Desktop 1440 — внутренний интерфейс операционной команды">
          <DCArtboard id="dashboard" label="A · Дашборд" width={AB_W} height={AB_H}>
            <AdminDashboard />
          </DCArtboard>
          <DCArtboard id="users" label="B · Пользователи" width={AB_W} height={AB_H}>
            <AdminUsers />
          </DCArtboard>
          <DCArtboard id="generations" label="C · Генерации" width={AB_W} height={AB_H}>
            <AdminGenerations />
          </DCArtboard>
          <DCArtboard id="tokens" label="D · Токены (список)" width={AB_W} height={AB_H}>
            <AdminTokens showModal={false} />
          </DCArtboard>
          <DCArtboard id="tokens-modal" label="E · Токены · начисление" width={AB_W} height={AB_H}>
            <AdminTokens showModal={true} />
          </DCArtboard>
          <DCArtboard id="finance" label="F · Финансы" width={AB_W} height={AB_H}>
            <AdminFinance />
          </DCArtboard>
          <DCArtboard id="settings" label="G · Настройки" width={AB_W} height={AB_H}>
            <AdminSettings />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
