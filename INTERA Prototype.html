<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTERA — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  body { background: #ECE4D4; overflow: hidden; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="screens-a.jsx"></script>
<script type="text/babel" src="screens-b.jsx"></script>
<script type="text/babel" src="screens-c.jsx"></script>
<script type="text/babel" src="screens-d.jsx"></script>

<script type="text/babel">
  const PHONE_W = 375;
  const PHONE_H = 812;
  const AB_W = 420;
  const AB_H = 880;

  function Phone({ children }) {
    return (
      <div style={{
        width: AB_W, height: AB_H,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        <IOSDevice width={PHONE_W} height={PHONE_H}>
          {children}
        </IOSDevice>
      </div>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="onboarding" title="Онбординг" subtitle="Welcome → Создание аккаунта">
          <DCArtboard id="welcome" label="01 · Welcome" width={AB_W} height={AB_H}>
            <Phone><ScreenWelcome /></Phone>
          </DCArtboard>
          <DCArtboard id="signup" label="02 · Создать аккаунт" width={AB_W} height={AB_H}>
            <Phone><ScreenSignUp /></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="flow" title="Создание проекта" subtitle="Главная → Фото → Параметры → Предпочтения → Генерация → Результат">
          <DCArtboard id="home" label="03 · Главная" width={AB_W} height={AB_H}>
            <Phone><ScreenHome /></Phone>
          </DCArtboard>
          <DCArtboard id="upload" label="04 · Загрузка фото" width={AB_W} height={AB_H}>
            <Phone><ScreenUpload /></Phone>
          </DCArtboard>
          <DCArtboard id="params" label="05 · Параметры" width={AB_W} height={AB_H}>
            <Phone><ScreenParams /></Phone>
          </DCArtboard>
          <DCArtboard id="prefs" label="06 · Предпочтения" width={AB_W} height={AB_H}>
            <Phone><ScreenPreferences /></Phone>
          </DCArtboard>
          <DCArtboard id="loading" label="07 · Генерация" width={AB_W} height={AB_H}>
            <Phone><ScreenLoading /></Phone>
          </DCArtboard>
          <DCArtboard id="result" label="08 · Результат" width={AB_W} height={AB_H}>
            <Phone><ScreenResult /></Phone>
          </DCArtboard>
          <DCArtboard id="render" label="09 · Просмотр рендера" width={AB_W} height={AB_H}>
            <Phone><ScreenRender /></Phone>
          </DCArtboard>
          <DCArtboard id="explanations" label="10 · Объяснения" width={AB_W} height={AB_H}>
            <Phone><ScreenExplanations /></Phone>
          </DCArtboard>
          <DCArtboard id="shopping" label="11 · Список покупок" width={AB_W} height={AB_H}>
            <Phone><ScreenShopping /></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="account" title="Аккаунт" subtitle="Профиль, токены, оплата">
          <DCArtboard id="success" label="12 · Оплата прошла" width={AB_W} height={AB_H}>
            <Phone><ScreenPaymentSuccess /></Phone>
          </DCArtboard>
          <DCArtboard id="profile" label="13 · Профиль" width={AB_W} height={AB_H}>
            <Phone><ScreenProfile /></Phone>
          </DCArtboard>
          <DCArtboard id="shop" label="14 · Магазин токенов" width={AB_W} height={AB_H}>
            <Phone><ScreenShop /></Phone>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
