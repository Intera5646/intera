<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTERA — Admin Panel · Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; background: #ECE4D4; font-family: 'Manrope', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page {
    width: 1440px; height: 1000px;
    margin: 24px auto;
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(50,40,25,0.18);
    position: relative;
    break-after: page;
  }
  .page:last-child { break-after: auto; }
  .page-tag {
    position: absolute; top: 14px; right: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: rgba(34,30,26,0.45); z-index: 10;
  }

  @page {
    size: 1440px 1000px;
    margin: 0;
  }
  @media print {
    body { background: white; }
    .page { margin: 0; box-shadow: none; break-after: page; }
    .page:last-child { break-after: auto; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="admin.jsx"></script>
<script type="text/babel" src="admin-2.jsx"></script>

<script type="text/babel">
  function PrintDeck() {
    const pages = [
      { label: 'A · Дашборд',                el: <AdminDashboard /> },
      { label: 'B · Пользователи',           el: <AdminUsers /> },
      { label: 'C · Генерации',              el: <AdminGenerations /> },
      { label: 'D · Токены · список',        el: <AdminTokens showModal={false} /> },
      { label: 'E · Токены · начисление',    el: <AdminTokens showModal={true} /> },
      { label: 'F · Финансы',                el: <AdminFinance /> },
      { label: 'G · Настройки',              el: <AdminSettings /> },
    ];
    return (
      <React.Fragment>
        {pages.map((p, i) => (
          <div key={i} className="page">
            <div className="page-tag">INTERA · Admin · {p.label}</div>
            {p.el}
          </div>
        ))}
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<PrintDeck />);

  // Auto-print after fonts + babel scripts settle
  (async () => {
    try { await document.fonts.ready; } catch (e) {}
    setTimeout(() => window.print(), 800);
  })();
</script>

</body>
</html>
